spring.application.name=account-service
debug=false
server.address=${MUNCHY_ACCOUNT_BIND_ADDRESS:127.0.0.1}
server.port=${MUNCHY_ACCOUNT_PORT:8082}

spring.r2dbc.url=r2dbc:postgresql://${MUNCHY_ACCOUNT_DB_HOST:localhost}:${MUNCHY_ACCOUNT_DB_PORT:5432}/${MUNCHY_ACCOUNT_DB_NAME:munchy_account}?schema=account
spring.r2dbc.username=${MUNCHY_ACCOUNT_DB_USERNAME:munchy_account_app}
spring.r2dbc.password=${MUNCHY_ACCOUNT_DB_PASSWORD}

# Flyway uses JDBC for migrations; application queries remain reactive through R2DBC.
spring.flyway.url=jdbc:postgresql://${MUNCHY_ACCOUNT_DB_HOST:localhost}:${MUNCHY_ACCOUNT_DB_PORT:5432}/${MUNCHY_ACCOUNT_DB_NAME:munchy_account}
spring.flyway.user=${MUNCHY_ACCOUNT_DB_USERNAME:munchy_account_app}
spring.flyway.password=${MUNCHY_ACCOUNT_DB_PASSWORD}
spring.flyway.default-schema=account
spring.flyway.schemas=account
spring.flyway.create-schemas=true
# The schema was initially created through pgAdmin. Baseline it as V1 once, then use migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

munchy.jwt.secret=${MUNCHY_JWT_SECRET}
munchy.jwt.access-token-duration=${MUNCHY_JWT_ACCESS_DURATION:15m}
munchy.jwt.refresh-token-duration=${MUNCHY_JWT_REFRESH_DURATION:7d}

management.endpoints.web.exposure.include=health,info
logging.level.org.springframework.r2dbc=INFO
logging.level.org.springframework.web.reactive.function.client=INFO
logging.level.root=INFO
