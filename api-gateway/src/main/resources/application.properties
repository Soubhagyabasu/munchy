spring.application.name=api-gateway
debug=false
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=order-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/orders/**

spring.cloud.gateway.server.webflux.routes[1].id=account-service
spring.cloud.gateway.server.webflux.routes[1].uri=${MUNCHY_ACCOUNT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/users/**

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

server.reactive.session.cookie.name=munchy_oauth_session
server.reactive.session.cookie.http-only=true
server.reactive.session.cookie.secure=${MUNCHY_COOKIE_SECURE:true}
server.reactive.session.cookie.same-site=lax

munchy.frontend-success-url=${MUNCHY_FRONTEND_SUCCESS_URL:http://localhost:4200/auth/callback}
munchy.frontend-failure-url=${MUNCHY_FRONTEND_FAILURE_URL:http://localhost:4200/access-denied}
munchy.jwt.secret=${MUNCHY_JWT_SECRET}
munchy.jwt.access-token-duration=${MUNCHY_JWT_ACCESS_DURATION:15m}
munchy.jwt.refresh-token-duration=${MUNCHY_JWT_REFRESH_DURATION:7d}
munchy.cookie.secure=${MUNCHY_COOKIE_SECURE:true}
munchy.cookie.domain=${MUNCHY_COOKIE_DOMAIN:}
munchy.account-service-url=${MUNCHY_ACCOUNT_SERVICE_URL:http://localhost:8082}

# Never enable reactive HTTP client DEBUG logging in OAuth environments; token bodies are sensitive.
logging.level.org.springframework.web.reactive.function.client=INFO
logging.level.org.springframework.http.codec=INFO
logging.level.root=INFO
